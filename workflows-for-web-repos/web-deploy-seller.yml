name: Deploy Seller Admin Web

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install dependencies
        run: npm ci
      - name: Build
        env:
          VITE_API_BASE_URL: https://api.e-parts.biz
        run: npm run build
      - name: Setup AWS + SSH via EC2 Instance Connect
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-northeast-2
        run: |
          pip install --quiet awscli
          mkdir -p ~/.ssh
          ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519 -q
          aws ec2-instance-connect send-ssh-public-key \
            --instance-id i-0098b04bbd2ce49f1 \
            --instance-os-user ec2-user \
            --availability-zone ap-northeast-2c \
            --ssh-public-key file://$HOME/.ssh/id_ed25519.pub
          ssh-keyscan -H 3.37.222.243 >> ~/.ssh/known_hosts 2>/dev/null
          echo "Host *" > ~/.ssh/config
          echo "  StrictHostKeyChecking accept-new" >> ~/.ssh/config
      - name: Rsync to EC2
        run: rsync -az --delete dist/ ec2-user@3.37.222.243:/home/ec2-user/E-PARTS-ADMIN-FE-main/dist/
      - name: Reload nginx
        run: ssh ec2-user@3.37.222.243 "sudo nginx -s reload" 
