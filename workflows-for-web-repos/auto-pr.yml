name: Auto-create PR from Claude branch

on:
  push:
    branches:
      - 'claude/**'

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@v4

      - name: Find related issue number
        id: issue
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          NUM=$(echo "$BRANCH" | grep -oE 'issue-[0-9]+' | grep -oE '[0-9]+' || true)
          echo "num=$NUM" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Create PR
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_ISSUE_PAT }}
          BRANCH: ${{ steps.issue.outputs.branch }}
          ISSUE_NUM: ${{ steps.issue.outputs.num }}
          REPO: ${{ github.repository }}
        run: |
          EXISTING=$(gh pr list --repo "$REPO" --head "$BRANCH" --json number --jq '.[0].number' || echo "")
          if [ -n "$EXISTING" ]; then
            echo "PR already exists: #$EXISTING"
            exit 0
          fi
          COMMIT_MSG=$(git log -1 --pretty=%s)
          BODY_FILE=$(mktemp)
          echo "Claude Code가 자동 생성한 PR입니다." >> "$BODY_FILE"
          if [ -n "$ISSUE_NUM" ]; then
            echo "" >> "$BODY_FILE"
            echo "Closes #$ISSUE_NUM" >> "$BODY_FILE"
            echo "Fixes https://github.com/$REPO/issues/$ISSUE_NUM" >> "$BODY_FILE"
          fi
          gh pr create \
            --repo "$REPO" \
            --title "$COMMIT_MSG" \
            --body-file "$BODY_FILE" \
            --base main \
            --head "$BRANCH"
