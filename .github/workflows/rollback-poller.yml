name: Rollback Poller

# 트리거: 로컬 데몬(~/qa-daemon/daemon.mjs)이 5분 백업 + rollbackRequestedAt 즉시 트리거.
# schedule 크론은 quota 소진 회피 위해 제거 (2026-09-10).
on:
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - name: Poll rollbackRequestedAt and revert
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          CLAUDE_ISSUE_PAT: ${{ secrets.CLAUDE_ISSUE_PAT }}
        run: npm run rollback-poll
