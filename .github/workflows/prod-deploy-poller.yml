name: Prod Deploy Poller

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - name: Poll and cherry-pick to production branches
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          CLAUDE_ISSUE_PAT: ${{ secrets.CLAUDE_ISSUE_PAT }}
        run: npm run prod-deploy-poll
