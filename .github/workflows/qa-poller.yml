name: QA Poller — dispatch to Claude

# 트리거: 로컬 데몬(~/qa-daemon/daemon.mjs)이 workflow_dispatch로 5분마다 백업 + Firestore
# 이벤트 실시간 즉시 트리거. schedule 크론은 private repo Actions 무료 tier 2000분/월 소진
# 회피 위해 제거 (2026-09-10).
on:
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - name: Poll Firestore and dispatch GitHub issues
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          CLAUDE_ISSUE_PAT: ${{ secrets.CLAUDE_ISSUE_PAT }}
        run: npm run poll
